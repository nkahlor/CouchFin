# cargo-deny: licences, security advisories, banned crates and sources.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
# Couchfin only ships for Linux (Bazzite/SteamOS) on the dev image's two
# architectures, so Windows- and Apple-only crates are left out of the checks.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# Unmaintained and yanked crates fail the check alongside vulnerabilities.
unmaintained = "all"
yanked = "deny"
ignore = [
  # ttf-parser comes in only through winit's Wayland client-side decorations
  # (sctk-adwaita), which a fullscreen window doesn't draw. It is unmaintained,
  # not vulnerable, and no upgrade exists yet. Drop this once winit moves on.
  { id = "RUSTSEC-2026-0192", reason = "unmaintained ttf-parser via winit's sctk-adwaita; no fix available" },
  # zbus 6.0.0 absorbed zbus_names, zvariant and zvariant_derive, so the
  # standalone crates are marked unmaintained (not vulnerable). They come in
  # only through zbus-secret-service-keyring-store 1.0.1, which is still on
  # zbus 5. Drop these once it moves to zbus 6 (issue #67).
  { id = "RUSTSEC-2026-0370", reason = "zvariant via the keyring store's zbus 5; no zbus 6 release yet (#67)" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names via the keyring store's zbus 5; no zbus 6 release yet (#67)" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via the keyring store's zbus 5; no zbus 6 release yet (#67)" },
]

[licenses]
# Permissive licences compatible with shipping Couchfin as MIT. Add to this
# list deliberately, in the PR that adds the dependency.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# The list is written ahead of the dependencies that will need it.
unused-allowed-license = "allow"

# Slint is GPL-3.0-only OR one of its own licences. Couchfin takes the
# royalty-free desktop licence, never GPL, and only for Slint's own crates.
# Its attribution and other conditions are in
# docs/decisions/003-slint-licence.md.
exceptions = [
  { crate = "i-slint-backend-selector", allow = [
    "LicenseRef-Slint-Royalty-free-2.0",
  ] },
  { crate = "i-slint-backend-winit", allow = [
    "LicenseRef-Slint-Royalty-free-2.0",
  ] },
  { crate = "i-slint-common", allow = [
    "LicenseRef-Slint-Royalty-free-2.0",
  ] },
  { crate = "i-slint-compiler", allow = [
    "LicenseRef-Slint-Royalty-free-2.0",
  ] },
  { crate = "i-slint-core", allow = [
    "LicenseRef-Slint-Royalty-free-2.0",
  ] },
  { crate = "i-slint-core-macros", allow = [
    "LicenseRef-Slint-Royalty-free-2.0",
  ] },
  { crate = "i-slint-renderer-femtovg", allow = [
    "LicenseRef-Slint-Royalty-free-2.0",
  ] },
  # Only the screenshots example links it (decision 018).
  { crate = "i-slint-renderer-software", allow = [
    "LicenseRef-Slint-Royalty-free-2.0",
  ] },
  { crate = "slint", allow = [
    "LicenseRef-Slint-Royalty-free-2.0",
  ] },
  { crate = "slint-build", allow = [
    "LicenseRef-Slint-Royalty-free-2.0",
  ] },
  { crate = "slint-macros", allow = [
    "LicenseRef-Slint-Royalty-free-2.0",
  ] },
  # MPL-2.0 is copyleft per file: only changes to option-ext's own files would
  # have to be shared, and we use it unmodified, through `directories`. See
  # docs/decisions/007-session-persistence.md.
  { crate = "option-ext", allow = [
    "MPL-2.0",
  ] },
]

[licenses.private]
# Workspace crates are publish = false and inherit the root MIT licence.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates have no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
