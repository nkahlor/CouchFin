[package]
name = "app"
description = "Couchfin binary: wires the crates together and runs the main loop"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "couchfin"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
couchfin-api.workspace = true
couchfin-core.workspace = true
couchfin-input.workspace = true
couchfin-player.workspace = true
couchfin-ui.workspace = true
# Backend and renderer features come from couchfin-ui.
slint = { workspace = true, features = ["std", "compat-1-2"] }

[dev-dependencies]
serde_json.workspace = true
toml.workspace = true

[lints]
workspace = true
