[package]
name = "app"
description = "Couchfin binary: wires the crates together and runs the main loop"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The wiring lives in the library, so tests/ can run it against wiremock.
[lib]
path = "src/lib.rs"

[[bin]]
name = "couchfin"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
couchfin-api.workspace = true
couchfin-core.workspace = true
couchfin-gamepad.workspace = true
couchfin-player.workspace = true
couchfin-ui.workspace = true
# Backend and renderer features come from couchfin-ui.
slint = { workspace = true, features = ["std", "compat-1-2"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
image.workspace = true
i-slint-backend-testing.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true
wiremock.workspace = true

[lints]
workspace = true
