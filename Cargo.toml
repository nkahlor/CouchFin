[package]
name = "couchfin"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
slint = "1.18.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
url = "2.5.8"

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
serde_json = "1.0.154"
wiremock = "0.6.0"
