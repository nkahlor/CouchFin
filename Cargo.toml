[workspace]
resolver = "3"
members = ["app", "crates/*"]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/nkahlor/CouchFin"

# couchfin-player and couchfin-ui keep copies of this table with
# `unsafe_code = "deny"`, since Cargo can't override a single inherited lint.
# app/tests/lint_config.rs keeps them in step.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[workspace.dependencies]
couchfin-api = { path = "crates/couchfin-api" }
couchfin-core = { path = "crates/couchfin-core" }
couchfin-input = { path = "crates/couchfin-input" }
couchfin-player = { path = "crates/couchfin-player" }
couchfin-ui = { path = "crates/couchfin-ui" }

anyhow = "1"
# Only the features couchfin-api uses. TLS is rustls with ring as its crypto
# provider, not OpenSSL or aws-lc-rs: see docs/decisions/006-api-client-design.md.
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "rustls-no-provider",
] }
rpassword = "7.5"
rustls = { version = "0.23.4", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "1.1"
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6.5"

# Slint's internal crates must all be the same version, so all three are
# pinned exactly. Licence: docs/decisions/003-slint-licence.md.
i-slint-backend-testing = "=1.18.1"
slint = { version = "=1.18.1", default-features = false }
slint-build = "=1.18.1"
