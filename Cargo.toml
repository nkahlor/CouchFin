[workspace]
resolver = "3"
members = ["app", "crates/*"]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/nkahlor/CouchFin"

# couchfin-player and couchfin-ui keep copies of this table with
# `unsafe_code = "deny"`, since Cargo can't override a single inherited lint.
# app/tests/lint_config.rs keeps them in step.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[workspace.dependencies]
couchfin-api = { path = "crates/couchfin-api" }
couchfin-core = { path = "crates/couchfin-core" }
couchfin-gamepad = { path = "crates/couchfin-gamepad" }
couchfin-player = { path = "crates/couchfin-player" }
couchfin-ui = { path = "crates/couchfin-ui" }

anyhow = "1"
# Config paths under $XDG_CONFIG_HOME. Brings in option-ext (MPL-2.0); see
# docs/decisions/007-session-persistence.md.
directories = "6"
# Joining the home rows' requests; no executor, so core stays runtime-free.
futures-util = { version = "0.3", default-features = false, features = [
  "alloc",
] }
# The keyring ecosystem's core API, with its pure-Rust (zbus) Secret Service
# store below, rather than the `keyring` wrapper crate: see decision 007.
# BlurHash placeholders (decision 016); no default features, so no `image`.
blurhash = { version = "0.2", default-features = false }
# Decoding posters (decision 016): only the formats Jellyfin
# serves, none of the default features (no rayon, GIF or AVIF).
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }
keyring-core = "1"
rcgen = "0.14"
# Only the features couchfin-api uses. TLS is rustls with ring as its crypto
# provider, not OpenSSL or aws-lc-rs: see docs/decisions/006-api-client-design.md.
reqwest = { version = "0.13.5", default-features = false, features = [
  "http2",
  "json",
  "rustls-no-provider",
] }
rpassword = "7.5"
rustls = { version = "0.23.4", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
# The same verifier reqwest uses: the system trust store, plus extra roots.
rustls-platform-verifier = "0.7"
# Game controllers only (decision 010). Pinned exactly: a new release is a
# deliberate upgrade, tested on the TV. Links the system SDL3, found through
# pkg-config.
sdl3 = "=0.20.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "1.1"
tracing = "0.1"
# Logging to stderr for now, filtered by RUST_LOG; file logging comes later.
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
  "std",
] }
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6.5"
# D-Bus through zbus (pure Rust) and Rust crypto, so neither libdbus nor
# OpenSSL is linked.
zbus-secret-service-keyring-store = { version = "1", features = [
  "crypto-rust",
] }

# Slint's internal crates must all be the same version, so all three are
# pinned exactly. Licence: docs/decisions/003-slint-licence.md.
i-slint-backend-testing = "=1.18.1"
slint = { version = "=1.18.1", default-features = false }
slint-build = "=1.18.1"

# Dependencies are optimised even in `cargo run`: image decoding is about 20x
# slower unoptimised, which made posters look slow on the TV (decision 016).
# Our own crates stay at opt-level 0 so edits rebuild quickly. Cost: the
# dependencies compile slower once (cached until Cargo.lock or the profile changes).
[profile.dev.package."*"]
opt-level = 2
