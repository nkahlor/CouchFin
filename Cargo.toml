[workspace]
resolver = "3"
members = ["app", "crates/*"]
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/nkahlor/CouchFin"

# couchfin-player keeps a copy of this table with `unsafe_code = "deny"`, since
# Cargo can't override a single inherited lint. app/tests/lint_config.rs keeps
# the two in step.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[workspace.dependencies]
couchfin-api = { path = "crates/couchfin-api" }
couchfin-core = { path = "crates/couchfin-core" }
couchfin-input = { path = "crates/couchfin-input" }
couchfin-player = { path = "crates/couchfin-player" }
couchfin-ui = { path = "crates/couchfin-ui" }

serde_json = "1"
toml = "0.9"
