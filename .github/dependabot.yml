# Weekly dependency updates, grouped so each ecosystem opens at most a couple
# of PRs a week. The prefixes give Conventional Commit titles such as
# `build(deps): bump the cargo-minor group ...`.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # Patch and minor bumps together; each major bump gets its own PR, since
      # those are the ones that need code changes.
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
