name: Release

# Pushing a v* tag runs the CI checks on it, builds the couchfin binary in the
# dev container image and publishes a GitHub Release whose notes git-cliff
# generates from the Conventional Commits since the previous release (see
# cliff.toml and docs/decisions/004-release-notes.md). A tag with a hyphen
# (v0.2.0-rc.1) becomes a pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

# Container jobs default to `sh`; use bash everywhere so steps behave the same
# in and out of the dev image.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.ref_name }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read

  build:
    name: build
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/nkahlor/couchfin-dev:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # A final release must match the version Cargo builds into the binary.
      # Pre-release tags are exempt, so the workflow can be tried on a branch.
      - name: Check tag matches the app version
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "app"))')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the app version v$version in Cargo.toml"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked --bin couchfin

      - name: Package
        run: |
          name="couchfin-$TAG-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/couchfin LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # git-cliff isn't in the dev image, and only this job needs it.
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      # git-cliff's --latest/--current pick the range between the two newest
      # tags and so ignore cliff.toml's ignore_tags; an explicit range doesn't.
      # A final release starts at the previous final release, a pre-release
      # at the previous tag of any kind. With no previous tag, the notes cover
      # the whole history up to the tag.
      - name: Generate release notes
        run: |
          if [[ "$TAG" == *-* ]]; then
            prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$TAG^" 2>/dev/null || true)"
          else
            prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-*' "$TAG^" 2>/dev/null || true)"
          fi
          if [ -n "$prev" ]; then
            git cliff --strip all --output notes.md "$prev..$TAG"
          else
            git cliff --strip all --output notes.md
          fi
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "No changes since ${prev:-the start of the project}." > notes.md
          fi
          # Slint's licence requires its badge where the binaries are
          # downloaded (docs/decisions/003-slint-licence.md).
          cat .github/release-footer.md >> notes.md
          cat notes.md

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --notes-file notes.md "${prerelease[@]}"
